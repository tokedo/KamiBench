<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="mf2-desc">
  <title id="mf2-desc">First success per onboarding milestone, per model, against cumulative tokens on a log scale — Run 2, on the hardened stack. haiku-4.5 reached all seven milestones within 1.76M tokens; gpt-4o-mini registered at 3.19M tokens but never completed a quest; gemini-2.5-flash-lite reached all seven milestones within 29.64M tokens.</title>

  <rect class="mf-bg" x="0.5" y="0.5" width="719" height="411" rx="14" fill="#faf9f7" stroke="#e5e1da"/>

  <!-- legend (fixed series order: arm 1 haiku, arm 2 gpt-4o-mini, arm 3 gemini) -->
  <g>
    <circle class="mf-s1" cx="206" cy="27" r="5.5" fill="#2a78d6"/>
    <text class="mf-legend-label" x="218" y="31.5" font-size="12.5" fill="#1c1917">haiku-4.5</text>
    <circle class="mf-s2" cx="330" cy="27" r="5.5" fill="#008300"/>
    <text class="mf-legend-label" x="342" y="31.5" font-size="12.5" fill="#1c1917">gpt-4o-mini</text>
    <circle class="mf-s3" cx="470" cy="27" r="5.5" fill="#e87ba4"/>
    <text class="mf-legend-label" x="482" y="31.5" font-size="12.5" fill="#1c1917">gemini-2.5-flash-lite</text>
  </g>

  <!-- decade grid: 0.1M, 1M, 10M, 100M tokens -->
  <line class="mf-grid" x1="200" y1="52" x2="200" y2="340" stroke="#e5e1da"/>
  <line class="mf-grid" x1="346.7" y1="52" x2="346.7" y2="340" stroke="#e5e1da"/>
  <line class="mf-grid" x1="493.3" y1="52" x2="493.3" y2="340" stroke="#e5e1da"/>
  <line class="mf-grid" x1="640" y1="52" x2="640" y2="340" stroke="#e5e1da"/>
  <line class="mf-grid" x1="196" y1="340" x2="644" y2="340" stroke="#e5e1da"/>

  <!-- not-reached gutter -->
  <line class="mf-grid" x1="650" y1="52" x2="650" y2="340" stroke="#e5e1da" stroke-dasharray="3 3"/>
  <text class="mf-tick" x="678" y="46" font-size="10" text-anchor="middle" fill="#6d675f">not reached</text>

  <!-- row guides + labels -->
  <g stroke="#e5e1da" stroke-dasharray="1.5 4">
    <line class="mf-rowline" x1="200" y1="70" x2="640" y2="70"/>
    <line class="mf-rowline" x1="200" y1="112" x2="640" y2="112"/>
    <line class="mf-rowline" x1="200" y1="154" x2="640" y2="154"/>
    <line class="mf-rowline" x1="200" y1="196" x2="640" y2="196"/>
    <line class="mf-rowline" x1="200" y1="238" x2="640" y2="238"/>
    <line class="mf-rowline" x1="200" y1="280" x2="640" y2="280"/>
    <line class="mf-rowline" x1="200" y1="322" x2="640" y2="322"/>
  </g>
  <g font-size="13" text-anchor="end" fill="#1c1917">
    <text class="mf-rowlabel" x="186" y="74.5">bridge to Yominet</text>
    <text class="mf-rowlabel" x="186" y="116.5">operator funded</text>
    <text class="mf-rowlabel" x="186" y="158.5">account registered</text>
    <text class="mf-rowlabel" x="186" y="200.5">first quest</text>
    <text class="mf-rowlabel" x="186" y="242.5">first kami</text>
    <text class="mf-rowlabel" x="186" y="284.5">harvest started</text>
    <text class="mf-rowlabel" x="186" y="326.5">MUSU banked</text>
  </g>

  <!-- haiku-4.5 (series 1) -->
  <g class="mf-s1" fill="#2a78d6" stroke="#faf9f7" stroke-width="2">
    <circle class="mf-dot" cx="240.9" cy="70" r="5.5"><title>haiku-4.5 — bridge ETH mainnet→Yominet landed: 07-19 16:30 UTC · h0.2 · session 1 · 0.19M tok · $0.05</title></circle>
    <circle class="mf-dot" cx="286.7" cy="112" r="5.5"><title>haiku-4.5 — operator wallet funded: 07-19 16:45 UTC · h0.4 · session 2 · 0.39M tok · $0.11</title></circle>
    <circle class="mf-dot" cx="281.6" cy="154" r="5.5"><title>haiku-4.5 — account registered: 07-19 16:45 UTC · h0.4 · session 2 · 0.36M tok · $0.11</title></circle>
    <circle class="mf-dot" cx="314.1" cy="196" r="5.5"><title>haiku-4.5 — first quest completed: 07-19 16:45 UTC · h0.4 · session 2 · 0.60M tok · $0.15</title></circle>
    <circle class="mf-dot" cx="350.4" cy="238" r="5.5"><title>haiku-4.5 — first kami bought: 07-19 16:46 UTC · h0.4 · session 2 · 1.06M tok · $0.23</title></circle>
    <circle class="mf-dot" cx="372.5" cy="280" r="5.5"><title>haiku-4.5 — first MUSU harvest started: 07-19 17:50 UTC · h1.5 · session 3 · 1.50M tok · $0.38</title></circle>
    <circle class="mf-dot" cx="382.7" cy="322" r="5.5"><title>haiku-4.5 — first MUSU banked: 07-19 18:00 UTC · h1.7 · session 4 · 1.76M tok · $0.45</title></circle>
  </g>

  <!-- gpt-4o-mini (series 2) -->
  <g class="mf-s2" fill="#008300" stroke="#faf9f7" stroke-width="2">
    <circle class="mf-dot" cx="200" cy="70" r="5.5"><title>gpt-4o-mini — bridge ETH mainnet→Yominet landed: 07-19 16:30 UTC · h0.1 · session 1 · 0.10M tok · $0.01</title></circle>
    <circle class="mf-dot" cx="592.4" cy="112" r="5.5"><title>gpt-4o-mini — operator wallet funded: 07-25 04:20 UTC · h132.0 · session 188 · 47.35M tok · $4.20</title></circle>
    <circle class="mf-dot" cx="420.6" cy="154" r="5.5"><title>gpt-4o-mini — account registered: 07-20 00:45 UTC · h8.4 · session 12 · 3.19M tok · $0.27</title></circle>
  </g>
  <g class="mf-s2-o" fill="none" stroke="#008300" stroke-width="1.8">
    <circle cx="668" cy="196" r="4.5"><title>gpt-4o-mini — first quest completed: never happened</title></circle>
    <circle cx="668" cy="238" r="4.5"><title>gpt-4o-mini — first kami bought: never happened</title></circle>
    <circle cx="668" cy="280" r="4.5"><title>gpt-4o-mini — first MUSU harvest started: never happened</title></circle>
    <circle cx="668" cy="322" r="4.5"><title>gpt-4o-mini — first MUSU banked: never happened</title></circle>
  </g>

  <!-- gemini-2.5-flash-lite (series 3) -->
  <g class="mf-s3" fill="#e87ba4" stroke="#faf9f7" stroke-width="2">
    <circle class="mf-dot" cx="260.9" cy="70" r="5.5"><title>gemini-2.5-flash-lite — bridge ETH mainnet→Yominet landed: 07-19 16:30 UTC · h0.1 · session 1 · 0.26M tok · $0.01</title></circle>
    <circle class="mf-dot" cx="414.3" cy="112" r="5.5"><title>gemini-2.5-flash-lite — operator wallet funded: 07-19 17:35 UTC · h1.2 · session 2 · 2.89M tok · $0.04</title></circle>
    <circle class="mf-dot" cx="426.1" cy="154" r="5.5"><title>gemini-2.5-flash-lite — account registered: 07-19 18:40 UTC · h2.3 · session 3 · 3.48M tok · $0.06</title></circle>
    <circle class="mf-dot" cx="484.9" cy="196" r="5.5"><title>gemini-2.5-flash-lite — first quest completed: 07-20 01:30 UTC · h9.1 · session 11 · 8.76M tok · $0.17</title></circle>
    <circle class="mf-dot" cx="515.0" cy="238" r="5.5"><title>gemini-2.5-flash-lite — first kami bought: 07-20 11:15 UTC · h18.9 · session 20 · 14.06M tok · $0.28</title></circle>
    <circle class="mf-dot" cx="547.7" cy="280" r="5.5"><title>gemini-2.5-flash-lite — first MUSU harvest started: 07-21 02:25 UTC · h34.1 · session 34 · 23.46M tok · $0.47</title></circle>
    <circle class="mf-dot" cx="562.5" cy="322" r="5.5"><title>gemini-2.5-flash-lite — first MUSU banked: 07-21 12:10 UTC · h43.8 · session 43 · 29.64M tok · $0.62</title></circle>
  </g>

  <!-- direct series labels on the second row (first-row dots are clustered) -->
  <g font-size="11" fill="#6d675f">
    <text class="mf-label" x="296.7" y="116">haiku-4.5</text>
    <text class="mf-label" x="424.3" y="104">gemini-2.5-flash-lite</text>
    <text class="mf-label" x="582.4" y="116" text-anchor="end">gpt-4o-mini</text>
  </g>

  <!-- axis -->
  <g class="mf-tick" font-size="11.5" text-anchor="middle" fill="#6d675f">
    <text x="200" y="358">0.1M</text>
    <text x="346.7" y="358">1M</text>
    <text x="493.3" y="358">10M</text>
    <text x="640" y="358">100M</text>
  </g>
  <text class="mf-caption" x="420" y="379" font-size="12" text-anchor="middle" fill="#6d675f">Cumulative tokens at first success (input + output, log scale).</text>
  <text class="mf-caption" x="420" y="397" font-size="12" text-anchor="middle" fill="#6d675f">Hover a point for date, session number, and cumulative $.</text>
</svg>
