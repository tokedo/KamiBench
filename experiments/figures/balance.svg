<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="bf-desc">
  <title id="bf-desc">The running balance: S(t) = seed − inference_cost(t) − gas_spent(t) − infra_rent(t) + earnings(t). What the agent starts with and what it earns in-world, less what it spends on thinking, on transaction fees, and on server rent.</title>
  <rect class="af-bg" x="0.5" y="0.5" width="935" height="207" rx="14" fill="#faf9f7" stroke="#e5e1da"/>

  <!-- lead-in: the balance itself -->
  <text class="af-title" x="26" y="118" font-size="17.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#1c1917">S(t) =</text>

  <!-- seed -->
  <rect class="af-box" x="97.4" y="84" width="68.0" height="56" rx="9" fill="#ffffff" stroke="#d9d4cc"/>
  <text class="af-title" x="131.4" y="118" font-size="17.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#1c1917">seed</text>
  <line class="af-conn" x1="131.4" y1="64" x2="131.4" y2="84" stroke="#8f8a80"/>
  <text class="af-role" x="131.4" y="58" font-size="15.5" text-anchor="middle" fill="#6d675f">starting money</text>

  <!-- inference_cost(t) -->
  <text class="af-title" x="178.6" y="118" font-size="17.0" text-anchor="middle" fill="#1c1917">−</text>
  <rect class="af-box af-badge-var" x="191.8" y="84" width="198.0" height="56" rx="9" fill="#f3ddd5" stroke="#d9d4cc"/>
  <text class="af-badge-var-text" x="290.8" y="118" font-size="17.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#a03518">inference_cost(t)</text>
  <line class="af-conn" x1="290.8" y1="140" x2="290.8" y2="158" stroke="#8f8a80"/>
  <text class="af-role" x="290.8" y="174" font-size="15.5" text-anchor="middle" fill="#6d675f">cost of thinking</text>

  <!-- gas_spent(t) -->
  <text class="af-title" x="403.0" y="118" font-size="17.0" text-anchor="middle" fill="#1c1917">−</text>
  <rect class="af-box af-badge-var" x="416.1" y="84" width="147.0" height="56" rx="9" fill="#f3ddd5" stroke="#d9d4cc"/>
  <text class="af-badge-var-text" x="489.7" y="118" font-size="17.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#a03518">gas_spent(t)</text>
  <line class="af-conn" x1="489.7" y1="64" x2="489.7" y2="84" stroke="#8f8a80"/>
  <text class="af-role" x="489.7" y="58" font-size="15.5" text-anchor="middle" fill="#6d675f">transaction fees</text>

  <!-- infra_rent(t) -->
  <text class="af-title" x="576.4" y="118" font-size="17.0" text-anchor="middle" fill="#1c1917">−</text>
  <rect class="af-box af-badge-var" x="589.5" y="84" width="157.2" height="56" rx="9" fill="#f3ddd5" stroke="#d9d4cc"/>
  <text class="af-badge-var-text" x="668.2" y="118" font-size="17.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#a03518">infra_rent(t)</text>
  <line class="af-conn" x1="668.2" y1="140" x2="668.2" y2="158" stroke="#8f8a80"/>
  <text class="af-role" x="668.2" y="174" font-size="15.5" text-anchor="middle" fill="#6d675f">server rent</text>

  <!-- earnings(t) -->
  <text class="af-title" x="760.0" y="118" font-size="17.0" text-anchor="middle" fill="#1c1917">+</text>
  <rect class="af-box bf-in" x="773.1" y="84" width="136.8" height="56" rx="9" fill="#e6ede4" stroke="#d9d4cc"/>
  <text class="bf-in-text" x="841.6" y="118" font-size="17.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#4a6b52">earnings(t)</text>
  <line class="af-conn" x1="841.6" y1="64" x2="841.6" y2="84" stroke="#8f8a80"/>
  <text class="af-role" x="841.6" y="58" font-size="15.5" text-anchor="middle" fill="#6d675f">earned in-world</text>
</svg>
