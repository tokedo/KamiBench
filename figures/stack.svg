<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 690" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="stack-desc">
  <title id="stack-desc">The KamiBench stack. On your machine: your agent — any framework, any model, with kami-agent as an optional reference implementation — speaks MCP to kami-harness, the MCP server whose tools fall into four classes: ACT, PERCEIVE, OUTSOURCE, and META. ACT sends signed transactions to Kamigotchi, the on-chain world running on its own chain, Yominet. kami-lens, a local read-only mirror and projection, reads the chain over RPC and answers the PERCEIVE world-state queries. kamigotchi-gdd is the machine-readable world spec your agent can read. Above it all, kami-meter — the unified measurement system — observes the agent side (inference) and the world side (gas, earnings) into one ledger, independent of the agent under test.</title>
  <defs>
    <marker id="sf-head" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <path class="af-arrow" d="M0.5,0.5 L6.5,3.5 L0.5,6.5 Z" fill="#8f8a80"/>
    </marker>
  </defs>

  <rect class="af-bg" x="0.5" y="0.5" width="939" height="689" rx="14" fill="#faf9f7" stroke="#e5e1da"/>

  <!-- kami-meter: observes both sides, independent of the agent under test -->
  <path class="af-conn" d="M148,206.5 V80 H339.5" fill="none" stroke="#8f8a80" marker-end="url(#sf-head)"/>
  <path class="af-conn" d="M766,206.5 V80 H601.5" fill="none" stroke="#8f8a80" marker-end="url(#sf-head)"/>
  <rect class="af-box" x="345.5" y="24.5" width="250" height="110" rx="10" fill="#ffffff" stroke="#d9d4cc"/>
  <text class="af-title" x="363" y="54" font-size="16" font-weight="600" fill="#1c1917"><a href="https://github.com/tokedo/kami-meter"><tspan class="af-repo" fill="#a03518" text-decoration="underline">kami-meter</tspan></a></text>
  <text class="af-role" x="363" y="76" font-size="12.5" fill="#6d675f">unified measurement: inference,</text>
  <text class="af-role" x="363" y="94" font-size="12.5" fill="#6d675f">gas, earnings — one ledger,</text>
  <text class="af-role" x="363" y="112" font-size="12.5" fill="#6d675f">independent of the agent</text>

  <!-- boundary: everything an operator runs themselves -->
  <rect class="af-bound" x="24.5" y="158.5" width="500" height="500" rx="14" fill="none" stroke="#d9d4cc" stroke-dasharray="7 6"/>
  <text class="af-conn-label" x="48" y="188" font-size="10.5" font-weight="700" letter-spacing="0.1em" fill="#6d675f">YOUR MACHINE</text>

  <!-- your agent (black box) with the optional reference scaffold ghosted inside -->
  <rect class="af-box af-box-var" x="48.5" y="206.5" width="200" height="168" rx="10" fill="#ffffff" stroke="#a03518" stroke-width="1.5"/>
  <text class="af-title" x="66" y="236" font-size="16" font-weight="600" fill="#1c1917">Your agent</text>
  <text class="af-role" x="66" y="258" font-size="12.5" fill="#6d675f">any framework, any</text>
  <text class="af-role" x="66" y="276" font-size="12.5" fill="#6d675f">model — yours</text>
  <rect class="af-bound" x="60.5" y="296.5" width="176" height="64" rx="8" fill="none" stroke="#d9d4cc" stroke-dasharray="5 5"/>
  <text x="72" y="320" font-size="13"><a href="https://github.com/tokedo/kami-agent"><tspan class="af-repo" fill="#a03518" text-decoration="underline">kami-agent</tspan></a></text>
  <text class="af-role" x="72" y="338" font-size="11" fill="#6d675f">reference implementation,</text>
  <text class="af-role" x="72" y="353" font-size="11" fill="#6d675f">optional</text>

  <!-- your agent ↔ kami-harness -->
  <line class="af-conn" x1="254" y1="260" x2="294" y2="260" stroke="#8f8a80" marker-start="url(#sf-head)" marker-end="url(#sf-head)"/>
  <text class="af-conn-label" x="274" y="248" font-size="12" text-anchor="middle" fill="#6d675f">MCP</text>

  <!-- kami-harness with its four tool-class ports -->
  <rect class="af-box" x="300.5" y="186.5" width="176" height="236" rx="10" fill="#ffffff" stroke="#d9d4cc"/>
  <text class="af-title" x="318" y="216" font-size="16" font-weight="600" fill="#1c1917"><a href="https://github.com/tokedo/kami-harness"><tspan class="af-repo" fill="#a03518" text-decoration="underline">kami-harness</tspan></a></text>
  <text class="af-role" x="318" y="238" font-size="12.5" fill="#6d675f">the MCP server</text>
  <rect class="af-badge" x="318" y="258" width="90" height="22" rx="11" fill="#e8ebef"/>
  <text class="af-badge-text" x="363" y="273" font-size="10" font-weight="700" letter-spacing="0.08em" text-anchor="middle" fill="#4a5568">ACT</text>
  <rect class="af-badge" x="318" y="294" width="90" height="22" rx="11" fill="#e8ebef"/>
  <text class="af-badge-text" x="363" y="309" font-size="10" font-weight="700" letter-spacing="0.08em" text-anchor="middle" fill="#4a5568">OUTSOURCE</text>
  <rect class="af-badge" x="318" y="330" width="90" height="22" rx="11" fill="#e8ebef"/>
  <text class="af-badge-text" x="363" y="345" font-size="10" font-weight="700" letter-spacing="0.08em" text-anchor="middle" fill="#4a5568">META</text>
  <rect class="af-badge" x="318" y="366" width="90" height="22" rx="11" fill="#e8ebef"/>
  <text class="af-badge-text" x="363" y="381" font-size="10" font-weight="700" letter-spacing="0.08em" text-anchor="middle" fill="#4a5568">PERCEIVE</text>

  <!-- ACT → Kamigotchi -->
  <line class="af-conn" x1="408.5" y1="269" x2="633" y2="269" stroke="#8f8a80" marker-end="url(#sf-head)"/>
  <text class="af-conn-label" x="540" y="257" font-size="12" text-anchor="middle" fill="#6d675f">signed transactions</text>

  <!-- kami-lens → PERCEIVE (the lens answers world-state queries) -->
  <line class="af-conn" x1="363.5" y1="510" x2="363.5" y2="394.5" stroke="#8f8a80" marker-end="url(#sf-head)"/>
  <text class="af-conn-label" x="376" y="460" font-size="12" fill="#6d675f">world state</text>

  <!-- kami-lens -->
  <rect class="af-box" x="300.5" y="510.5" width="176" height="110" rx="10" fill="#ffffff" stroke="#d9d4cc"/>
  <text class="af-title" x="318" y="540" font-size="16" font-weight="600" fill="#1c1917"><a href="https://github.com/tokedo/kami-lens"><tspan class="af-repo" fill="#a03518" text-decoration="underline">kami-lens</tspan></a></text>
  <text class="af-role" x="318" y="562" font-size="12.5" fill="#6d675f">local mirror + projection,</text>
  <text class="af-role" x="318" y="580" font-size="12.5" fill="#6d675f">the game's own rules —</text>
  <text class="af-role" x="318" y="598" font-size="12.5" fill="#6d675f">read-only</text>

  <!-- the chain → kami-lens (the lens only reads) -->
  <path class="af-conn" d="M628.5,356.5 H586 V565.5 H482.5" fill="none" stroke="#8f8a80" marker-end="url(#sf-head)"/>
  <text class="af-conn-label" x="531" y="553" font-size="12" text-anchor="middle" fill="#6d675f">chain RPC (reads)</text>

  <!-- kamigotchi-gdd: docs artifact the agent reads -->
  <rect class="af-box" x="48.5" y="540.5" width="200" height="80" rx="10" fill="#ffffff" stroke="#d9d4cc"/>
  <text x="66" y="568" font-size="14" font-weight="600"><a href="https://github.com/tokedo/kamigotchi-gdd"><tspan class="af-repo" fill="#a03518" text-decoration="underline">kamigotchi-gdd</tspan></a></text>
  <text class="af-role" x="66" y="588" font-size="12" fill="#6d675f">the world spec, extracted</text>
  <text class="af-role" x="66" y="604" font-size="12" fill="#6d675f">from the game's source</text>
  <line class="af-conn" x1="148.5" y1="540" x2="148.5" y2="382" stroke="#8f8a80" marker-end="url(#sf-head)"/>
  <text class="af-conn-label" x="160" y="463" font-size="12" fill="#6d675f">world spec</text>

  <!-- Kamigotchi on its chain -->
  <rect class="af-box" x="640.5" y="206.5" width="252" height="130" rx="10" fill="#ffffff" stroke="#d9d4cc"/>
  <text class="af-title" x="658" y="236" font-size="16" font-weight="600" fill="#1c1917"><a href="https://github.com/Asphodel-OS/kamigotchi"><tspan class="af-repo" fill="#a03518" text-decoration="underline">Kamigotchi</tspan></a></text>
  <text class="af-role" x="658" y="262" font-size="12.5" fill="#6d675f">the on-chain world — live,</text>
  <text class="af-role" x="658" y="280" font-size="12.5" fill="#6d675f">permissionless, built by Asphodel;</text>
  <text class="af-role" x="658" y="298" font-size="12.5" fill="#6d675f">every action is a transaction</text>
  <rect class="af-badge" x="628.5" y="336.5" width="276" height="40" rx="6" fill="#e8ebef"/>
  <text class="af-badge-text" x="766" y="361" font-size="10" font-weight="700" letter-spacing="0.08em" text-anchor="middle" fill="#4a5568">YOMINET — KAMIGOTCHI'S OWN CHAIN</text>
</svg>
